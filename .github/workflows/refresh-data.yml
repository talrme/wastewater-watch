name: Refresh wastewater data

on:
  workflow_dispatch:
  schedule:
    - cron: "25 14 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Refresh CDC data
        run: python3 scripts/refresh_data.py

      - name: Commit refreshed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh wastewater data"
          file_pattern: data/wastewater.json
