<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wastewater Watch - Bay Radar</title>
  <meta name="theme-color" content="#f4f7ef">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="hero-copy">
        <p class="eyebrow">Bay Radar</p>
        <h1>Wastewater Watch</h1>
        <p>COVID, Flu A, and RSV signals from real CDC NWSS wastewater data, tuned for Bay Area check-ins.</p>
      </div>
      <button type="button" class="settings-button" data-open-settings aria-label="Open settings" title="Settings"><span class="settings-glyph" aria-hidden="true"></span></button>
    </header>
    <section class="control-panel" aria-label="Chart controls">
      <div class="control-group"><label>Area<select data-area-select></select></label><p data-area-note></p></div>
      <div class="control-group"><span class="eyebrow">Range</span><div class="range-row" data-range-controls></div><span class="eyebrow">Pathogens</span><div class="pathogen-row" data-pathogen-controls></div></div>
      <div class="refresh-group"><button type="button" class="refresh-button" data-refresh-now>Refresh now</button><p class="status-line" data-status></p></div>
    </section>
    <section class="cards-panel"><div class="status-cards" data-cards></div></section>
    <section class="chart-panel">
      <div class="chart-heading"><div><p class="eyebrow" data-area-name></p><h2>Viral activity over time</h2></div><p data-source-line></p></div>
      <div class="chart-wrap" data-chart></div>
      <div class="summary-grid" data-summary></div>
    </section>
    <section class="sites-panel" data-sites-section><div class="sites-heading"><div><p class="eyebrow">Latest site rows</p><h2>What is hot right now?</h2></div></div><div class="table-scroll"><table class="sites-table" data-sites-table></table></div></section>
    <section class="source-panel"><p class="eyebrow">Source notes</p><div data-source-notes></div></section>
  </main>
  <div class="modal-backdrop" data-settings-backdrop hidden></div>
  <section class="settings-modal" data-settings-modal hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings-panel"><header><div><p class="eyebrow">Wastewater Watch</p><h2 id="settings-title">Settings</h2></div><button type="button" data-close-settings aria-label="Close settings">x</button></header><div data-settings-fields></div><div class="settings-actions"><button type="button" class="plain-button" data-clear-live>Use bundled data</button></div></div>
  </section>
  <script src="../shared/app.js"></script>
</body>
</html>
