<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wastewater Watch - Signal Board</title>
  <meta name="theme-color" content="#101721">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="signal">
  <main class="app-shell">
    <header class="hero">
      <div class="hero-copy">
        <p class="eyebrow">Signal Board</p>
        <h1>Wastewater Watch</h1>
        <p>A quieter operations-board view for quickly checking whether respiratory virus signals are rising.</p>
      </div>
      <button type="button" class="settings-button" data-open-settings aria-label="Open settings" title="Settings"><span class="settings-glyph" aria-hidden="true"></span></button>
    </header>
    <section class="control-panel" aria-label="Chart controls">
      <div class="control-group"><label>Region<select data-area-select></select></label><p data-area-note></p></div>
      <div class="control-group"><span class="eyebrow">Window</span><div class="range-row" data-range-controls></div><span class="eyebrow">Show</span><div class="pathogen-row" data-pathogen-controls></div></div>
      <div class="refresh-group"><button type="button" class="refresh-button" data-refresh-now>Refresh data</button><p class="status-line" data-status></p></div>
    </section>
    <section class="chart-panel">
      <div class="chart-heading"><div><p class="eyebrow" data-area-name></p><h2>Respiratory wastewater signal</h2></div><p data-source-line></p></div>
      <div class="chart-wrap" data-chart></div>
      <div class="point-details" data-point-details></div>
      <div class="summary-grid" data-summary></div>
    </section>
    <section class="cards-panel"><div class="status-cards" data-cards></div></section>
    <section class="sites-panel" data-sites-section><div class="sites-heading"><div><p class="eyebrow">Sorted by concern</p><h2>Latest reporting sites</h2></div></div><div class="table-scroll"><table class="sites-table" data-sites-table></table></div></section>
    <section class="source-panel"><p class="eyebrow">Read this carefully</p><div data-source-notes></div></section>
  </main>
  <div class="modal-backdrop" data-settings-backdrop hidden></div>
  <section class="settings-modal" data-settings-modal hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings-panel"><header><div><p class="eyebrow">Signal Board</p><h2 id="settings-title">Settings</h2></div><button type="button" data-close-settings aria-label="Close settings">x</button></header><div data-settings-fields></div><div class="settings-actions"><button type="button" class="plain-button" data-clear-live>Use bundled data</button></div></div>
  </section>
  <script src="../shared/app.js" data-data-path="../data/wastewater.json"></script>
</body>
</html>
